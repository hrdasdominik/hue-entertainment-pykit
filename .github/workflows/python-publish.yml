name: Build and Publish Hue Entertainment PyKit

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ "3.10", "3.11", "3.12" ]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.release.tag_name || github.ref }}
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine packaging
      - name: Build package
        run: python -m build
      - name: Test package
        run: python -m twine check dist/*
      - name: Verify release version
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from packaging.utils import parse_wheel_filename
          from packaging.version import Version

          expected = Version(os.environ["RELEASE_TAG"])
          if expected.is_devrelease or expected.local:
              raise SystemExit("Release tags must not contain development or local versions")
          wheel, = Path("dist").glob("*.whl")
          actual = parse_wheel_filename(wheel.name)[1]
          if actual != expected:
              raise SystemExit(f"Release tag version {expected} does not match package version {actual}")
          print(f"Verified release version: {actual}")
          PY
      - name: Publish to PyPI
        if: github.event_name == 'release' && matrix.python-version == '3.10'
        run: python -m twine upload dist/*
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
