[build-system]
requires = ["setuptools>=80.9.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hue-entertainment-pykit"
version = "0.10.0"
authors = [
    {name = "Dominik Hrdas"}
]
description = "A comprehensive Python toolkit for Philips Hue Entertainment API"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10, <=3.12.11"
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Utilities"
]
dependencies = [
    "certifi==2025.10.5",
    "charset-normalizer==3.4.4",
    "click==8.3.0",
    "colorama==0.4.6",
    "idna==3.11",
    "ifaddr==0.2.0",
    "mypy-extensions==1.1.0",
    "packaging==25.0",
    "pathspec==0.12.1",
    "platformdirs==4.5.0",
    "pydantic==2.11.8",
    "pydantic-core==2.33.2",
    "python-mbedtls==2.10.1",
    "requests==2.32.5",
    "typing_extensions==4.15.0",
    "urllib3==2.5.0",
    "zeroconf==0.148.0"
]
keywords = ["philips", "hue", "lights", "entertainment", "api", "python"]

[project.urls]
Repository = "https://github.com/hrdasdominik/hue-entertainment-pykit"

[options]
package_dir = "src/hue_entertainment_pykit"
